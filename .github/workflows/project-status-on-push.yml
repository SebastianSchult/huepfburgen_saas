name: Project Status On Push

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  move-ticket-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Validate project automation token
        env:
          PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$PROJECT_AUTOMATION_TOKEN" ]; then
            echo "::error::Missing secret PROJECT_AUTOMATION_TOKEN. Add a PAT (classic) with scopes: repo, project."
            exit 1
          fi

      - name: Move linked issue to In Progress
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            try {
              const projectId = "PVT_kwHOCUUiJM4BRvo_";
              const statusFieldId = "PVTSSF_lAHOCUUiJM4BRvo_zg_e3NI";
              const inProgressOptionId = "10b8ed08";

              const branch = context.ref.replace("refs/heads/", "");
              const owner = context.repo.owner;
              const repo = context.repo.repo;

              // If there is already an open PR for this branch, do not move
              // the issue back from Review/Test to In Progress on subsequent pushes.
              const headRefWithOwner = `${owner}:${branch}`;
              const existingPr = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: headRefWithOwner,
                per_page: 1
              });

              if (existingPr.data.length > 0) {
                core.info(`Open PR exists for '${branch}'. Skipping In Progress update.`);
                return;
              }

              let issueNumber = null;
              let match = branch.match(/^(\d+)-/);
              if (match) {
                issueNumber = Number(match[1]);
              }

              // Support Codex branch naming like "codex/issue-14-something".
              if (!issueNumber) {
                match = branch.match(/^codex\/issue-(\d+)(?:-|$)/);
                if (match) {
                  issueNumber = Number(match[1]);
                }
              }

              // Fallback: parse issue reference from pushed commit messages.
              if (!issueNumber) {
                const commits = context.payload.commits ?? [];
                for (const commit of commits) {
                  const text = `${commit.message ?? ""}`;
                  const issueMatch = text.match(/#(\d+)/);
                  if (issueMatch) {
                    issueNumber = Number(issueMatch[1]);
                    break;
                  }
                }
              }

              if (!issueNumber) {
                core.info(`No issue number found from branch '${branch}' or commit messages. Skipping.`);
                return;
              }

              const issueData = await github.graphql(
                `
                query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      id
                      number
                      title
                    }
                  }
                }
                `,
                { owner, repo, issueNumber }
              );

              const issue = issueData.repository?.issue;
              if (!issue) {
                core.info(`No issue #${issueNumber} found in ${owner}/${repo}. Skipping.`);
                return;
              }

              let hasNextPage = true;
              let cursor = null;
              let itemId = null;

              while (hasNextPage && !itemId) {
                const projectData = await github.graphql(
                  `
                  query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            id
                            content {
                              ... on Issue {
                                id
                                number
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  `,
                  { projectId, cursor }
                );

                const items = projectData.node?.items?.nodes ?? [];
                const matchItem = items.find((item) => item.content?.id === issue.id);
                if (matchItem) {
                  itemId = matchItem.id;
                  break;
                }

                hasNextPage = projectData.node?.items?.pageInfo?.hasNextPage ?? false;
                cursor = projectData.node?.items?.pageInfo?.endCursor ?? null;
              }

              if (!itemId) {
                const addData = await github.graphql(
                  `
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item {
                        id
                      }
                    }
                  }
                  `,
                  { projectId, contentId: issue.id }
                );
                itemId = addData.addProjectV2ItemById.item.id;
                core.info(`Added issue #${issueNumber} to project.`);
              }

              await github.graphql(
                `
                mutation($projectId: ID!, $itemId: ID!, $statusFieldId: ID!, $inProgressOptionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $statusFieldId
                      value: { singleSelectOptionId: $inProgressOptionId }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
                `,
                { projectId, itemId, statusFieldId, inProgressOptionId }
              );

              core.info(`Moved issue #${issueNumber} to In Progress.`);
            } catch (error) {
              const message = error?.message ?? String(error);
              if (message.includes("Resource not accessible by integration")) {
                core.setFailed(
                  "PROJECT_AUTOMATION_TOKEN has insufficient access to the project. Use a token with project scope and repository access."
                );
                return;
              }
              core.setFailed(`Project automation failed: ${message}`);
            }
