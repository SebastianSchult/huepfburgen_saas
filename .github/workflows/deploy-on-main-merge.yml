name: Deploy On Main Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
        run: |
          required_secrets=(
            DEPLOY_SSH_HOST
            DEPLOY_SSH_USER
            DEPLOY_SSH_PORT
            DEPLOY_SSH_PRIVATE_KEY
            DEPLOY_TARGET_DIR
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing secret ${secret_name}."
              exit 1
            fi
          done

      - name: Deploy with Docker Compose over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_TARGET_DIR }}"
            if [ ! -f ".env.production" ]; then
              echo ".env.production is missing on server."
              exit 1
            fi
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file .env.production -f docker-compose.prod.yml pull postgres redis caddy
            docker compose --env-file .env.production -f docker-compose.prod.yml build backend
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend npx prisma db push --schema prisma/schema.prisma
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d backend caddy
